<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="LudoVerse — Classic Ludo board game">
  <title>LudoVerse — Classic Ludo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0F1A"/>
      <stop offset="0.55" stop-color="#141A2B"/>
      <stop offset="1" stop-color="#1B2136"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.78" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#E53935" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#E53935" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0.12" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#1E88E5" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1E88E5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E53935"/>
      <stop offset="1" stop-color="#F9A825"/>
    </linearGradient>
    <filter id="boardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <clipPath id="boardClip">
      <rect x="0" y="0" width="480" height="480" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glowRed)"/>
  <rect width="1280" height="720" fill="url(#glowBlue)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 90H1280M0 180H1280M0 270H1280M0 360H1280M0 450H1280M0 540H1280M0 630H1280"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720"/>
  </g>
  <rect x="18" y="18" width="1244" height="684" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Left: copy -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    <g>
      <rect x="110" y="186" width="268" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <g transform="translate(134 200)" fill="none" stroke="#F9A825" stroke-width="2.2" stroke-linejoin="round">
        <rect x="0" y="0" width="16" height="16" rx="4"/>
        <circle cx="5" cy="5" r="1.5" fill="#F9A825" stroke="none"/>
        <circle cx="11" cy="11" r="1.5" fill="#F9A825" stroke="none"/>
      </g>
      <text x="164" y="215" font-size="19" font-weight="600" fill="#E4E4E7" letter-spacing="0.2">Classic Board Game</text>
    </g>

    <text x="110" y="380" font-size="104" font-weight="800" letter-spacing="-3" fill="#FAFAFA">Ludo<tspan fill="#E53935">Verse</tspan></text>
    <rect x="110" y="410" width="180" height="8" rx="4" fill="url(#accent)"/>

    <text x="110" y="472" font-size="31" font-weight="500" fill="#A1A1AA">Roll the dice. Bring your tokens home.</text>

    <g font-size="20" font-weight="600" fill="#E4E4E7">
      <g>
        <rect x="110" y="510" width="176" height="50" rx="14" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <circle cx="140" cy="535" r="7" fill="#43A047"/>
        <text x="160" y="542">2–4 Players</text>
      </g>
      <g>
        <rect x="302" y="510" width="200" height="50" rx="14" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <circle cx="332" cy="535" r="7" fill="#1E88E5"/>
        <text x="352" y="542">Offline &amp; Online</text>
      </g>
      <g>
        <rect x="518" y="510" width="152" height="50" rx="14" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <circle cx="548" cy="535" r="7" fill="#F9A825"/>
        <text x="568" y="542">Next.js</text>
      </g>
    </g>
  </g>

  <!-- Right: Ludo board -->
  <g transform="translate(760 120)" filter="url(#boardShadow)">
    <rect x="0" y="0" width="480" height="480" rx="18" fill="#FFFFFF"/>
    <g clip-path="url(#boardClip)">
      <!-- white track cross -->
      <rect x="0" y="0" width="480" height="480" fill="#FFFFFF"/>
      <rect x="192" y="0" width="96" height="480" fill="#FAFAFA"/>
      <rect x="0" y="192" width="480" height="96" fill="#FAFAFA"/>

      <!-- home lanes -->
      <rect x="32" y="224" width="160" height="32" fill="#E53935"/>
      <rect x="224" y="32" width="32" height="160" fill="#43A047"/>
      <rect x="288" y="224" width="160" height="32" fill="#F9A825"/>
      <rect x="224" y="288" width="32" height="160" fill="#1E88E5"/>

      <!-- cell grid lines -->
      <g stroke="#D4D4D8" stroke-width="1" opacity="0.9">
        <path d="M192 32H288M192 64H288M192 96H288M192 128H288M192 160H288M192 224H288M192 256H288M192 320H288M192 352H288M192 384H288M192 416H288M192 448H288"/>
        <path d="M32 192V288M64 192V288M96 192V288M128 192V288M160 192V288M224 192V288M256 192V288M320 192V288M352 192V288M384 192V288M416 192V288M448 192V288"/>
      </g>

      <!-- start cells -->
      <rect x="32" y="192" width="32" height="32" fill="#E53935"/>
      <rect x="256" y="32" width="32" height="32" fill="#43A047"/>
      <rect x="416" y="256" width="32" height="32" fill="#F9A825"/>
      <rect x="192" y="416" width="32" height="32" fill="#1E88E5"/>
      <g fill="#FFFFFF" opacity="0.85">
        <path d="M48 200l16 8-16 8z"/>
        <path d="M272 40l8 16-16 8z"/>
        <path d="M432 272l-16-8 16-8z"/>
        <path d="M208 440l-8-16 16-8z"/>
      </g>

      <!-- quadrants -->
      <rect x="0" y="0" width="192" height="192" fill="#E53935"/>
      <rect x="288" y="0" width="192" height="192" fill="#43A047"/>
      <rect x="288" y="288" width="192" height="192" fill="#F9A825"/>
      <rect x="0" y="288" width="192" height="192" fill="#1E88E5"/>

      <g fill="#FFFFFF" filter="url(#soft)">
        <rect x="26" y="26" width="140" height="140" rx="14"/>
        <rect x="314" y="26" width="140" height="140" rx="14"/>
        <rect x="314" y="314" width="140" height="140" rx="14"/>
        <rect x="26" y="314" width="140" height="140" rx="14"/>
      </g>

      <!-- tokens in nests -->
      <g stroke="#FFFFFF" stroke-width="4">
        <circle cx="62" cy="62" r="21" fill="#E53935"/>
        <circle cx="130" cy="62" r="21" fill="#E53935"/>
        <circle cx="62" cy="130" r="21" fill="#E53935"/>
        <circle cx="130" cy="130" r="21" fill="#E53935"/>

        <circle cx="350" cy="62" r="21" fill="#43A047"/>
        <circle cx="418" cy="62" r="21" fill="#43A047"/>
        <circle cx="350" cy="130" r="21" fill="#43A047"/>
        <circle cx="418" cy="130" r="21" fill="#43A047"/>

        <circle cx="350" cy="350" r="21" fill="#F9A825"/>
        <circle cx="418" cy="350" r="21" fill="#F9A825"/>
        <circle cx="350" cy="418" r="21" fill="#F9A825"/>
        <circle cx="418" cy="418" r="21" fill="#F9A825"/>

        <circle cx="62" cy="350" r="21" fill="#1E88E5"/>
        <circle cx="130" cy="350" r="21" fill="#1E88E5"/>
        <circle cx="62" cy="418" r="21" fill="#1E88E5"/>
        <circle cx="130" cy="418" r="21" fill="#1E88E5"/>
      </g>

      <!-- tokens on track -->
      <g stroke="#FFFFFF" stroke-width="4">
        <circle cx="208" cy="208" r="12" fill="#E53935"/>
        <circle cx="272" cy="112" r="12" fill="#43A047"/>
        <circle cx="368" cy="272" r="12" fill="#F9A825"/>
        <circle cx="208" cy="368" r="12" fill="#1E88E5"/>
      </g>

      <!-- finish home -->
      <g>
        <rect x="224" y="224" width="32" height="32" fill="#FFFFFF" stroke="#D4D4D8"/>
        <path d="M224 224h32l-16 16z" fill="#E53935"/>
        <path d="M256 224v32l-16-16z" fill="#43A047"/>
        <path d="M256 256h-32l16-16z" fill="#1E88E5"/>
        <path d="M224 256v-32l16 16z" fill="#F9A825"/>
      </g>
    </g>
    <rect x="0" y="0" width="480" height="480" rx="18" fill="none" stroke="#0C0F1A" stroke-opacity="0.28" stroke-width="2"/>
  </g>

  <!-- Dice badge -->
  <g transform="translate(1136 452)" filter="url(#soft)">
    <rect x="0" y="0" width="148" height="148" rx="30" fill="#FFFFFF"/>
    <rect x="0" y="0" width="148" height="148" rx="30" fill="none" stroke="#0C0F1A" stroke-opacity="0.14" stroke-width="2"/>
    <g fill="#E53935">
      <circle cx="44" cy="44" r="13"/>
      <circle cx="104" cy="44" r="13"/>
      <circle cx="44" cy="74" r="13"/>
      <circle cx="104" cy="74" r="13"/>
      <circle cx="44" cy="104" r="13"/>
      <circle cx="104" cy="104" r="13"/>
    </g>
  </g>

  <!-- Caption -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="110" y="636" font-size="22" font-weight="600" fill="#71717A" letter-spacing="1.6">PLAY  ·  ROLL  ·  RACE</text>
  </g>
</svg>
