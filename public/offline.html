<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E53935" />
    <title>Offline — LudoVerse</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fafafa;
        color: #18181b;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 380px;
        padding: 32px 24px;
        background: #fff;
        border: 1px solid #e4e4e7;
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 16px 0 8px; font-size: 22px; font-weight: 700; }
      p { margin: 0 0 20px; font-size: 14px; color: #71717a; line-height: 1.6; }
      a {
        display: inline-block;
        padding: 10px 22px;
        background: #e53935;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        border-radius: 10px;
      }
      a:active { background: #c62828; }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icon.svg" alt="" width="72" height="72" />
      <h1>You&rsquo;re offline</h1>
      <p>
        This page needs an internet connection. Pages you visited before going offline
        may still open from the cache.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
